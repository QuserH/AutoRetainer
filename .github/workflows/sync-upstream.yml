name: Sync Upstream and Build

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      build_current:
        description: Build and publish even when upstream has not changed
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync-upstream-and-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: PunishXIV/AutoRetainer
  PLUGIN_REPO: QuserH/zh-repo
  HAS_ZH_REPO_TOKEN: ${{ secrets.ZH_REPO_TOKEN != '' }}

jobs:
  sync-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch upstream
        shell: pwsh
        run: |
          git fetch "https://github.com/$env:UPSTREAM_REPO.git" master:refs/remotes/upstream/master
          $count = git rev-list --count HEAD..upstream/master
          Write-Output "Upstream commits pending: $count"
          if ($count -eq "0") {
            "UPSTREAM_CHANGED=false" >> $env:GITHUB_ENV
          } else {
            "UPSTREAM_CHANGED=true" >> $env:GITHUB_ENV
          }

      - name: Merge upstream and reapply localization
        if: env.UPSTREAM_CHANGED == 'true'
        shell: pwsh
        run: |
          git merge upstream/master --no-edit -X theirs
          python -m pip install --quiet opencc-python-reimplemented
          python tools/localize.py
          python tools/patch_cn.py
          git add AutoRetainer tools
          if (git diff --cached --quiet) {
            Write-Output "Localization produced no tracked changes."
          } else {
            git commit -m "chore: sync upstream and reapply localization"
          }
          git push origin HEAD:master

      - name: Decide whether to build
        shell: pwsh
        run: |
          $manualBuild = "${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.build_current }}" -eq "true"
          $shouldBuild = $manualBuild -or ($env:UPSTREAM_CHANGED -eq "true")
          "SHOULD_BUILD=$($shouldBuild.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Download Dalamud SDK
        if: env.SHOULD_BUILD == 'true'
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "dalamud"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Invoke-WebRequest -Uri "https://github.com/goatcorp/dalamud-distrib/raw/main/latest.zip" -OutFile (Join-Path $out "dalamud.zip")
          Expand-Archive -Path (Join-Path $out "dalamud.zip") -DestinationPath $out -Force
          Remove-Item (Join-Path $out "dalamud.zip")
          $dalamudAssembly = Get-ChildItem -Path $out -Recurse -Filter "Dalamud.dll" | Select-Object -First 1
          if ($null -eq $dalamudAssembly) { throw "Dalamud.dll was not found in the downloaded SDK." }
          $dalamudRoot = $dalamudAssembly.Directory.FullName
          "DALAMUD_HOME=$dalamudRoot" >> $env:GITHUB_ENV
          Write-Output "Using Dalamud SDK at $dalamudRoot"

      - name: Build plugin
        if: env.SHOULD_BUILD == 'true'
        shell: pwsh
        run: dotnet build AutoRetainer/AutoRetainer.csproj -c Release --nologo -p:DalamudLibPath="$env:DALAMUD_HOME\"

      - name: Read version
        if: env.SHOULD_BUILD == 'true'
        shell: pwsh
        run: |
          $version = (Select-String -Path "AutoRetainer/AutoRetainer.csproj" -Pattern '<Version>(.*?)</Version>').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload build artifact
        if: env.SHOULD_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AutoRetainer-${{ env.VERSION }}
          path: AutoRetainer/bin/Release/AutoRetainer/latest.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create or update release
        if: env.SHOULD_BUILD == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          Copy-Item "AutoRetainer/bin/Release/AutoRetainer/latest.zip" "AutoRetainer.zip"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "AutoRetainer.zip" --clobber
          } else {
            gh release create $tag "AutoRetainer.zip" --title "AutoRetainer $env:VERSION" --notes "Built from the current localized source after upstream synchronization."
          }

      - name: Checkout plugin repository
        if: env.SHOULD_BUILD == 'true' && env.HAS_ZH_REPO_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUGIN_REPO }}
          token: ${{ secrets.ZH_REPO_TOKEN }}
          path: plugin-repository

      - name: Update plugin repository entry
        if: env.SHOULD_BUILD == 'true' && env.HAS_ZH_REPO_TOKEN == 'true'
        shell: pwsh
        run: |
          $manifest = Get-Content "AutoRetainer/AutoRetainer.json" -Raw -Encoding utf8 | ConvertFrom-Json
          $masterPath = "plugin-repository/pluginmaster.json"
          [object[]]$entries = @(Get-Content $masterPath -Raw -Encoding utf8 | ConvertFrom-Json)
          $entry = $entries | Where-Object { $_.InternalName -eq $manifest.InternalName } | Select-Object -First 1
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/AutoRetainer.zip"

          if ($null -eq $entry) {
            $entry = [PSCustomObject][ordered]@{
              Author = $manifest.Author
              Name = $manifest.Name
              Punchline = $manifest.Punchline
              Description = $manifest.Description
              InternalName = $manifest.InternalName
              AssemblyVersion = $env:VERSION
              TestingAssemblyVersion = $null
              RepoUrl = "https://github.com/${{ github.repository }}"
              ApplicableVersion = $manifest.ApplicableVersion
              DalamudApiLevel = $manifest.DalamudApiLevel
              IsHide = $false
              IsTestingExclusive = $false
              DownloadLinkInstall = $downloadUrl
              DownloadLinkTesting = $null
              DownloadLinkUpdate = $downloadUrl
              LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            }
            $entries += $entry
          } else {
            $entry.Author = $manifest.Author
            $entry.Name = $manifest.Name
            $entry.Punchline = $manifest.Punchline
            $entry.Description = $manifest.Description
            $entry.AssemblyVersion = $env:VERSION
            $entry.RepoUrl = "https://github.com/${{ github.repository }}"
            $entry.ApplicableVersion = $manifest.ApplicableVersion
            $entry.DalamudApiLevel = $manifest.DalamudApiLevel
            $entry.DownloadLinkInstall = $downloadUrl
            $entry.DownloadLinkUpdate = $downloadUrl
            $entry.LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          }

          ConvertTo-Json -InputObject $entries -Depth 10 | Set-Content $masterPath -Encoding utf8
          Set-Location plugin-repository
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          if (git diff --cached --quiet) {
            Write-Output "pluginmaster.json is already current."
          } else {
            git commit -m "AutoRetainer: update to v$env:VERSION"
            git push origin HEAD:main
          }

      - name: Warn when plugin repository token is missing
        if: env.SHOULD_BUILD == 'true' && env.HAS_ZH_REPO_TOKEN != 'true'
        shell: pwsh
        run: Write-Output "::warning::Set the ZH_REPO_TOKEN repository secret to update QuserH/zh-repo/pluginmaster.json automatically."
